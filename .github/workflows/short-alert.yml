name: short-alert

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch:       # "Run workflow" button for manual tests
    inputs:
      test_telegram:
        description: "Only send a Telegram test message (no scan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Telegram test
        if: ${{ inputs.test_telegram }}
        run: |
          python - <<'EOF'
          import os, sys, requests
          base = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}"
          me = requests.get(f"{base}/getMe", timeout=15).json()
          if not me.get("ok"):
              sys.exit(f"Bot token rejected: {me.get('description')}")
          name = me["result"]["username"]
          print(f"Bot: @{name[:3]}...{name[-3:]}")
          cid = os.environ["TELEGRAM_CHAT_ID"].strip()
          print(f"Chat ID secret: {len(cid)} chars, numeric={cid.lstrip('-').isdigit()}")
          ups = requests.get(f"{base}/getUpdates", timeout=15).json().get("result", [])
          chats = {str((m.get("message") or m.get("my_chat_member") or {}).get("chat", {}).get("id")) for m in ups}
          print(f"Chats that recently messaged the bot: {len(chats - {'None'})}, configured chat among them: {cid in chats}")
          r = requests.post(f"{base}/sendMessage", timeout=15, json={
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": f"✅ Short Alert test from GitHub Actions via @{me['result']['username']}"}).json()
          if not r.get("ok"):
              sys.exit(f"Send failed: {r.get('description')}")
          print("Test message sent")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scan and alert
        if: ${{ !inputs.test_telegram }}
        run: python short_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save paper-trade state
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name "short-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
