name: short-alert

on:
  # Started every 30 min (:07 and :37) by cron-job.org via the GitHub API - see README.
  # GitHub's own schedule was removed: it skipped most hours and would use free minutes twice.
  workflow_dispatch:       # cron-job.org trigger + "Run workflow" button for manual tests
    inputs:
      test_telegram:
        description: "Only send a Telegram test message and check Hyperliquid connection (no scan, no orders)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Telegram test
        if: ${{ inputs.test_telegram }}
        run: |
          python - <<'EOF'
          import os, sys, requests
          base = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}"
          me = requests.get(f"{base}/getMe", timeout=15).json()
          if not me.get("ok"):
              sys.exit(f"Bot token rejected: {me.get('description')}")
          name = me["result"]["username"]
          print(f"Bot: @{name[:3]}...{name[-3:]}")
          cid = os.environ["TELEGRAM_CHAT_ID"].strip()
          print(f"Chat ID secret: {len(cid)} chars, numeric={cid.lstrip('-').isdigit()}")
          ups = requests.get(f"{base}/getUpdates", timeout=15).json().get("result", [])
          chats = {str((m.get("message") or m.get("my_chat_member") or {}).get("chat", {}).get("id")) for m in ups}
          print(f"Chats that recently messaged the bot: {len(chats - {'None'})}, configured chat among them: {cid in chats}")
          r = requests.post(f"{base}/sendMessage", timeout=15, json={
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": f"✅ Short Alert test from GitHub Actions via @{me['result']['username']}"}).json()
          if not r.get("ok"):
              sys.exit(f"Send failed: {r.get('description')}")
          print("Test message sent")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Hyperliquid connection test
        if: ${{ inputs.test_telegram }}
        run: |
          python - <<'EOF'
          import os
          print(f"TRADING_MODE: {os.environ.get('TRADING_MODE')} | HL_NETWORK: {os.environ.get('HL_NETWORK')}")
          if not os.environ.get("HL_API_PRIVATE_KEY"):
              print("No Hyperliquid API key set - paper mode only")
              raise SystemExit
          from hl_trader import Trader
          t = Trader()
          print(f"Connected to {t.network}: account value ${t.account_value():.2f}")
          EOF
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
          HL_NETWORK: ${{ vars.HL_NETWORK || 'mainnet' }}
          HL_ACCOUNT_ADDRESS: ${{ vars.HL_ACCOUNT_ADDRESS || secrets.HL_ACCOUNT_ADDRESS }}
          HL_API_PRIVATE_KEY: ${{ secrets.HL_API_PRIVATE_KEY }}

      - name: Scan and alert
        if: ${{ !inputs.test_telegram }}
        run: python short_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}       # paper | live
          HL_NETWORK: ${{ vars.HL_NETWORK || 'mainnet' }}         # mainnet | testnet
          HL_ACCOUNT_ADDRESS: ${{ vars.HL_ACCOUNT_ADDRESS || secrets.HL_ACCOUNT_ADDRESS }}
          HL_API_PRIVATE_KEY: ${{ secrets.HL_API_PRIVATE_KEY }}

      - name: Save trade state
        if: ${{ always() && !inputs.test_telegram }}
        run: |
          git config user.name "short-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
