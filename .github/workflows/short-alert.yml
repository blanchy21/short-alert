name: short-alert

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch:       # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:
  group: short-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scan and alert
        run: python short_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save paper-trade state
        run: |
          git config user.name "short-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
